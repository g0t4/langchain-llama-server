[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-llama-server"
version = "0.2.0"
description = "LangChain integrations for llama-server inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.2.10",
    "langchain-openai>=0.3.35",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=8.4.2",
    "pytest-watch>=4.2.0",
    "rich>=14.3.3",
    "yapf>=0.43.0",
]

[tool.bumpversion]
current_version = "0.2.0"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.hatch.build.targets.wheel]
packages = ["langchain_llama_server", "langchain_openai_compatible"]
exclude = ["/langchain_llama_server/tests", "/langchain_openai_compatible/tests"]
